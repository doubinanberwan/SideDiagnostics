name: Build

on:
  push:
    branches: [ "fix/dpi-and-tray" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (Release, net472)
    runs-on: windows-latest

    steps:
      - name: Checkout (with LibreHardwareMonitor submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore packages
        run: nuget restore SidebarDiagnostics.sln

      # The solution only contains the WPF app and LibreHardwareMonitorLib (no WiX setup project).
      # Building the app project directly keeps the submodule to its net472 target only.
      - name: Build
        run: msbuild SidebarDiagnostics\SidebarDiagnostics.csproj /p:Configuration=Release /p:Platform=AnyCPU /m /verbosity:minimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SidebarDiagnostics-Release
          path: SidebarDiagnostics/bin/Release/
          if-no-files-found: error
          retention-days: 14
